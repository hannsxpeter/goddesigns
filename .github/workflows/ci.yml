name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install integrity
        run: sh skills/goddesign/scripts/verify-install.sh
      - name: CLI inventory smoke
        run: sh -n skills/goddesign/scripts/detect-clis.sh && sh skills/goddesign/scripts/detect-clis.sh
      - name: deck lint
        run: node scripts/lint-decks.mjs
      - name: study tooling tests
        run: node --test scripts/study-a.test.mjs
      - name: rater install
        working-directory: study-a-rater
        run: npm ci --no-audit --no-fund
      - name: rater lint
        working-directory: study-a-rater
        run: npm run lint
      - name: rater test
        working-directory: study-a-rater
        run: npm test
      # Blocking gate: the surface that actually ships to raters. Production
      # dependencies must carry zero high or critical advisories.
      - name: dependency audit (production surface)
        working-directory: study-a-rater
        run: npm audit --audit-level=high --omit=dev
      # Informational: the eslint toolchain reaches brace-expansion only through
      # minimatch@3.1.5, the last 3.x release, which pins brace-expansion ^1.1.7.
      # GHSA-mh99-v99m-4gvg lists no patched 1.x, and 5.x cannot substitute
      # (its CommonJS build exports an object, so minimatch@3 throws "expand is
      # not a function"). This step keeps the drift visible without blocking a
      # dev-only advisory that has no production reachability.
      - name: dependency audit (full tree, informational)
        working-directory: study-a-rater
        run: npm audit --audit-level=high || true
