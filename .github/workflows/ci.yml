name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The docs promise Node 18 or newer for the skill's scripts; test the floor
        # as well as a current release.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: install integrity
        run: sh skills/goddesign/scripts/verify-install.sh && node skills/goddesign/scripts/pick.mjs --check
      - name: installer syntax
        run: sh -n scripts/install.sh
      - name: deck lint
        run: node scripts/lint-decks.mjs
      - name: variance engine tests
        run: node --test scripts/pick.test.mjs
      - name: provenance hygiene adapter tests
        run: sh -n skills/goddesign/scripts/provenance-hygiene.sh && node --test scripts/provenance-hygiene.test.mjs
      # The mechanical half of the QA gate. sweep.test.mjs asserts the corpus
      # split on a named subset (the kilnhouse, wayfare, and ledgerbird skill
      # pages against their comparison pages), not on every artifact on file.
      - name: gate sweep tests
        run: node --test scripts/sweep.test.mjs
      - name: comparison harness tests
        run: node --test scripts/arm-test.test.mjs
